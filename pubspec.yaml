name: lifetours
description: Aplicación móvil para agencia de tours - LifeTours
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3

  # Estado y arquitectura
  provider: ^6.1.2
  go_router: ^14.2.7

  # UI / Imágenes
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  shimmer: ^3.0.0

  # Utilidades
  intl: ^0.20.2
  equatable: ^2.0.5
  uuid: ^4.4.2
  logger: ^2.4.0
  shared_preferences: ^2.3.2

  # Íconos
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.13.1

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
